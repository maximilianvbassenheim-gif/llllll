<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake – Pixel Arcade</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container game-shell">
    <div class="topbar">
      <a class="btn secondary" href="../index.html">← Arcade</a>
      <h2>🐍 Snake</h2>
      <button class="btn" id="restart">Neu starten</button>
    </div>

    <div class="hud">
      <div>Punkte: <b id="score">0</b></div>
      <div>Bestwert: <b id="best">0</b></div>
    </div>

    <canvas id="game" width="400" height="400"></canvas>
    <p class="controls-hint">Pfeiltasten / WASD oder wischen auf dem Handy.</p>

    <div class="ad-slot"></div>
  </div>

  <script src="../js/ads.js"></script>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const GRID = 20, CELLS = canvas.width / GRID;
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");

    let snake, dir, nextDir, food, score, alive, tickMs, loop;
    let best = +(localStorage.getItem("snake_best") || 0);
    bestEl.textContent = best;

    function reset() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = dir;
      score = 0;
      alive = true;
      tickMs = 120;
      placeFood();
      scoreEl.textContent = score;
      clearInterval(loop);
      loop = setInterval(tick, tickMs);
    }

    function placeFood() {
      do {
        food = { x: (Math.random() * CELLS) | 0, y: (Math.random() * CELLS) | 0 };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function tick() {
      if (!alive) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
        if (tickMs > 60) { tickMs -= 3; clearInterval(loop); loop = setInterval(tick, tickMs); }
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = "#0a0b16";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00d2d3";
      ctx.fillRect(food.x * GRID + 2, food.y * GRID + 2, GRID - 4, GRID - 4);

      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#6c5ce7" : "#8a7bf0";
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
      });
    }

    function gameOver() {
      alive = false;
      clearInterval(loop);
      if (score > best) { best = score; localStorage.setItem("snake_best", best); bestEl.textContent = best; }
      ctx.fillStyle = "rgba(0,0,0,.6)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "16px sans-serif";
      ctx.fillText("Punkte: " + score, canvas.width / 2, canvas.height / 2 + 20);
    }

    function setDir(x, y) {
      if (x === -dir.x && y === -dir.y) return; // kein 180°-Turn
      nextDir = { x, y };
    }

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "arrowup" || k === "w") setDir(0, -1);
      else if (k === "arrowdown" || k === "s") setDir(0, 1);
      else if (k === "arrowleft" || k === "a") setDir(-1, 0);
      else if (k === "arrowright" || k === "d") setDir(1, 0);
    });

    // Touch / Swipe
    let tStart = null;
    canvas.addEventListener("touchstart", (e) => {
      tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener("touchend", (e) => {
      if (!tStart) return;
      const dx = e.changedTouches[0].clientX - tStart.x;
      const dy = e.changedTouches[0].clientY - tStart.y;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
      tStart = null;
    });

    document.getElementById("restart").addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
