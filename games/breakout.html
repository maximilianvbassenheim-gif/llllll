<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breakout – Pixel Arcade</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container game-shell">
    <div class="topbar">
      <a class="btn secondary" href="../index.html">← Arcade</a>
      <h2>🧱 Breakout</h2>
      <button class="btn" id="restart">Neu starten</button>
    </div>

    <div class="hud">
      <div>Punkte: <b id="score">0</b></div>
      <div>Leben: <b id="lives">3</b></div>
      <div>Level: <b id="level">1</b></div>
    </div>

    <canvas id="game" width="480" height="420"></canvas>
    <p class="controls-hint">Maus / Finger bewegen oder Pfeiltasten links/rechts.</p>

    <div class="ad-slot"></div>
  </div>

  <script src="../js/ads.js"></script>
  <script src="../js/sfx.js"></script>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const levelEl = document.getElementById("level");

    const ROWS = 5, COLS = 9, BRICK_H = 20, PAD = 6, TOP = 50;
    const COLORS = ["#6c5ce7", "#00d2d3", "#2ecc71", "#f1c40f", "#e84393"];

    let paddle, ball, bricks, score, lives, level, running, leftKey, rightKey;

    function makeBricks() {
      bricks = [];
      const bw = (W - PAD * (COLS + 1)) / COLS;
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          bricks.push({
            x: PAD + c * (bw + PAD), y: TOP + r * (BRICK_H + PAD),
            w: bw, h: BRICK_H, color: COLORS[r % COLORS.length], alive: true
          });
    }

    function resetBall() {
      ball = { x: W / 2, y: H - 60, r: 7, vx: 3 * (Math.random() > .5 ? 1 : -1), vy: -3.5 };
      paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 30, speed: 7 };
    }

    function reset() {
      score = 0; lives = 3; level = 1;
      running = true;
      makeBricks(); resetBall(); updateHud();
    }

    function nextLevel() {
      level++; ball.vx *= 1.12; ball.vy *= 1.12;
      makeBricks(); resetBall();
      ball.vx *= 1 + level * 0.05; ball.vy *= 1 + level * 0.05;
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      levelEl.textContent = level;
    }

    function step() {
      if (!running) return;

      if (leftKey) paddle.x -= paddle.speed;
      if (rightKey) paddle.x += paddle.speed;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

      ball.x += ball.vx; ball.y += ball.vy;

      if (ball.x < ball.r || ball.x > W - ball.r) ball.vx *= -1;
      if (ball.y < ball.r) ball.vy *= -1;

      // Paddle
      if (ball.y + ball.r >= paddle.y && ball.y < paddle.y + paddle.h &&
          ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.vy > 0) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const speed = Math.hypot(ball.vx, ball.vy);
        ball.vx = hit * speed * 0.8;
        ball.vy = -Math.sqrt(Math.max(1, speed * speed - ball.vx * ball.vx));
      }

      // Bricks
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
          b.alive = false; score += 10; updateHud();
          SFX.hit();
          ball.vy *= -1;
          break;
        }
      }

      if (bricks.every(b => !b.alive)) { nextLevel(); }

      // Ball lost
      if (ball.y > H) {
        lives--; updateHud();
        if (lives <= 0) { running = false; SFX.die(); }
        else { SFX.score(); resetBall(); }
      }

      draw();
      requestAnimationFrame(step);
    }

    function draw() {
      ctx.fillStyle = "#0a0b16";
      ctx.fillRect(0, 0, W, H);

      bricks.forEach(b => {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      ctx.fillStyle = "#eef0ff";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

      ctx.beginPath();
      ctx.fillStyle = "#00d2d3";
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      if (!running) {
        ctx.fillStyle = "rgba(0,0,0,.6)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText("Game Over", W / 2, H / 2 - 10);
        ctx.font = "16px sans-serif";
        ctx.fillText("Punkte: " + score, W / 2, H / 2 + 20);
      }
    }

    // Controls
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scale = W / rect.width;
      paddle.x = (e.clientX - rect.left) * scale - paddle.w / 2;
    });
    canvas.addEventListener("touchmove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scale = W / rect.width;
      paddle.x = (e.touches[0].clientX - rect.left) * scale - paddle.w / 2;
      e.preventDefault();
    }, { passive: false });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") leftKey = true;
      if (e.key === "ArrowRight") rightKey = true;
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") leftKey = false;
      if (e.key === "ArrowRight") rightKey = false;
    });

    document.getElementById("restart").addEventListener("click", () => {
      reset(); step();
    });

    reset();
    step();
  </script>
</body>
</html>
