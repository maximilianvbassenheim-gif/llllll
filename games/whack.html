<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whack-a-Pinky – Pixel Arcade</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .holes {
      display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
      max-width:420px; margin:0 auto;
    }
    .hole {
      aspect-ratio:1; background:#181a2e; border-radius:16px;
      border:1px solid rgba(255,255,255,.08); position:relative; overflow:hidden;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      box-shadow:var(--shadow); user-select:none;
    }
    .mole {
      font-size:3rem; transform:translateY(120%); transition:transform .12s ease;
    }
    .hole.up .mole { transform:translateY(0); }
    .hole.bonk .mole { transform:translateY(0) scale(.7) rotate(-15deg); }
    .timebar { height:14px; background:#181a2e; border-radius:7px; overflow:hidden; max-width:420px; margin:14px auto; }
    .timebar > div { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); width:100%; }
    .overlay {
      max-width:420px; margin:16px auto; padding:18px; text-align:center;
      background:linear-gradient(160deg,var(--panel),var(--bg-2));
      border:1px solid var(--accent); border-radius:14px; display:none;
    }
    .overlay.show { display:block; }
  </style>
</head>
<body>
  <div class="container game-shell">
    <div class="topbar">
      <a class="btn secondary" href="../index.html">← Arcade</a>
      <h2>🔨 Whack-a-Pinky</h2>
      <button class="btn" id="start">Start</button>
    </div>

    <div class="hud">
      <div>Punkte: <b id="score">0</b></div>
      <div>Bestwert: <b id="best">0</b></div>
      <div>Zeit: <b id="time">30</b>s</div>
    </div>
    <p class="controls-hint">Triff Pinky (🐭) für +1. Triff Brain (🧠) und du verlierst 2 Punkte!</p>

    <div class="ad-slot"></div>

    <div class="timebar"><div id="timefill"></div></div>
    <div class="holes" id="holes"></div>

    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Bereit?</h2>
      <p id="ovText" style="margin:10px 0;color:var(--muted);">Drück „Start" und hau auf die Mäuse!</p>
    </div>
  </div>

  <script src="../js/ads.js"></script>
  <script src="../js/sfx.js"></script>
  <script>
    const holesEl=document.getElementById("holes");
    const scoreEl=document.getElementById("score");
    const bestEl=document.getElementById("best");
    const timeEl=document.getElementById("time");
    const timeFill=document.getElementById("timefill");
    const overlay=document.getElementById("overlay");
    const NHOLES=9, ROUND=30;
    let holes=[], score=0, timeLeft=ROUND, running=false, popTimer, tickTimer;
    let best=+(localStorage.getItem("whack_best")||0);
    bestEl.textContent=best;

    for(let i=0;i<NHOLES;i++){
      const h=document.createElement("div");
      h.className="hole";
      h.innerHTML='<div class="mole"></div>';
      h.addEventListener("click",()=>bonk(i));
      holesEl.appendChild(h);
      holes.push({el:h, mole:h.querySelector(".mole"), up:false, type:null});
    }

    function show(){
      if(!running) return;
      // hide all first sometimes
      holes.forEach(h=>{ if(Math.random()<0.5){ h.up=false; h.el.classList.remove("up"); }});
      const free=holes.filter(h=>!h.up);
      if(free.length){
        const h=free[(Math.random()*free.length)|0];
        h.type = Math.random()<0.78 ? "pinky" : "brain";
        h.mole.textContent = h.type==="pinky" ? "🐭" : "🧠";
        h.up=true; h.el.classList.add("up");
        setTimeout(()=>{ h.up=false; h.el.classList.remove("up"); }, 700+Math.random()*500);
      }
      const speed = Math.max(350, 800 - (ROUND-timeLeft)*15);
      popTimer=setTimeout(show, speed);
    }

    function bonk(i){
      const h=holes[i];
      if(!running || !h.up) return;
      h.el.classList.add("bonk");
      setTimeout(()=>h.el.classList.remove("bonk"),120);
      if(h.type==="pinky"){ score+=1; SFX.hit(); }
      else { score=Math.max(0,score-2); SFX.die(); }
      h.up=false; h.el.classList.remove("up");
      scoreEl.textContent=score;
    }

    function start(){
      if(running) return;
      running=true; score=0; timeLeft=ROUND;
      scoreEl.textContent=0; timeEl.textContent=ROUND;
      timeFill.style.width="100%";
      overlay.classList.remove("show");
      show();
      tickTimer=setInterval(()=>{
        timeLeft--;
        timeEl.textContent=timeLeft;
        timeFill.style.width=(timeLeft/ROUND*100)+"%";
        if(timeLeft<=0) end();
      },1000);
    }

    function end(){
      running=false;
      clearTimeout(popTimer); clearInterval(tickTimer);
      holes.forEach(h=>{ h.up=false; h.el.classList.remove("up"); });
      SFX.win();
      if(score>best){ best=score; localStorage.setItem("whack_best",best); bestEl.textContent=best; }
      document.getElementById("ovTitle").textContent="Zeit um! 🔨";
      document.getElementById("ovText").textContent="Punkte: "+score+" · Bestwert: "+best;
      overlay.classList.add("show");
    }

    document.getElementById("start").addEventListener("click",start);
    overlay.classList.add("show");
  </script>
</body>
</html>
